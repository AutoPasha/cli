name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: тесты на Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  package:
    name: пакет собирается и содержит что нужно
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Проверяем не сборку (её нет), а состав архива: если из него выпадет
      # skill/SKILL.md или bin, установленный пакет сломается у пользователя,
      # а тесты этого не увидят — они ходят по исходникам.
      - run: npm pack --dry-run
      - name: команда работает из установленного пакета
        run: |
          npm pack
          npm i -g ./autopasha-cli-*.tgz
          autopasha --version
          autopasha --help
          autopasha skill | head -3
