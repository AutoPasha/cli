name: Публикация в npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Без этого не выдаётся provenance, и по нему же npm пускает публиковать
  # без токена: короткий ключ у GitHub вместо долгоживущего секрета.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # Вход по OIDC (trusted publishing) умеет npm начиная с 11.5.1. В образе
      # node 24 npm свежий, но версию ставим явно: от неё зависит, пойдёт
      # публикация без токена или сорвётся обратно на секрет.
      - run: npm i -g npm@^11.5.1
      - run: npm test
      # Версия могла уехать в реестр раньше релиза — тогда publish упал бы с 403
      # и покрасил бы прогон, хотя делать было нечего. Спрашиваем реестр и молча
      # пропускаем: релиз на уже выложенную версию — обычное дело, а не поломка.
      - name: версия уже в реестре?
        id: registry
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@autopasha/cli@$version" version > /dev/null 2>&1; then
            echo "@autopasha/cli@$version уже опубликован — публиковать нечего"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # Publish с provenance: npm подписывает пакет и показывает на странице,
      # из какого коммита он собран. Для пакета, который люди ставят глобально
      # и дают агенту, это единственный способ доказать происхождение.
      #
      # Токена тут больше нет: у пакета прописан доверенный издатель, и npm
      # берёт короткий ключ у GitHub по OIDC (проверено выпуском 0.1.1).
      # Запасной путь через NODE_AUTH_TOKEN убран сознательно: долгоживущий
      # секрет в релизном прогоне это ровно тот риск, ради которого затевался
      # переезд, а прямую публикацию токеном npm отключает в январе 2027.
      - if: steps.registry.outputs.skip == 'false'
        run: npm publish --provenance --access public
